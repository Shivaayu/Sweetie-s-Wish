/* Sweetie's Wish V0.3 — bloom atmosphere + gentle transitions (content untouched) */
body{background:radial-gradient(circle at 15% 0%,#fff 0,#fff3f8 30%,#f7edf9 65%,#f0e8f5 100%)}
body:has(.recipient){background:#2a202c}
.recipient{background:radial-gradient(circle at 50% 8%,rgba(255,205,225,.18),transparent 28%),radial-gradient(circle at 15% 75%,rgba(205,190,255,.13),transparent 30%),linear-gradient(160deg,#211a25 0%,#30232f 48%,#241c2b 100%);color:#fff}
.recipient:before,.recipient:after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(2px);opacity:.18}
.recipient:before{width:220px;height:220px;left:-80px;top:12%;background:#f28db4;box-shadow:720px 260px 0 60px #b89be9,260px 720px 0 30px #efb5cf}
.recipient:after{width:170px;height:170px;right:-70px;bottom:8%;background:#c9b3f2;box-shadow:-620px -440px 0 35px #f4a9c9}
.recipient .rec-stage{min-height:100vh;background:linear-gradient(180deg,rgba(24,17,28,.18),rgba(24,17,28,.42));}
.recipient .stage-card{background:rgba(255,250,253,.96);color:var(--ink);border-color:rgba(255,255,255,.78);box-shadow:0 30px 100px rgba(10,5,14,.42),0 0 0 1px rgba(242,141,180,.08);}
.recipient .stage-card .eyebrow{background:#fff7fb;border-color:#efdbe6}
.recipient .game-board,.recipient .balloon-board,.recipient .cake-board,.recipient .maze-grid,.recipient .memory-card,.recipient .game-choice{box-shadow:0 16px 42px rgba(31,18,33,.16)}
.transition-overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(32,22,34,.76);backdrop-filter:blur(12px);z-index:120;opacity:0;pointer-events:none;transition:opacity .28s ease}
.transition-overlay.show{opacity:1;pointer-events:auto}
.transition-card{width:min(520px,calc(100% - 34px));padding:28px 24px;text-align:center;border:1px solid rgba(255,255,255,.25);border-radius:30px;background:rgba(255,248,252,.97);box-shadow:0 30px 100px rgba(0,0,0,.35);animation:transitionCard .7s ease both}
.transition-kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#aa6688;font-weight:800}
.transition-title{font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,42px);line-height:1.08;margin:10px 0 8px;color:#302733}

function wishText(f){const langs=(f.langs&&f.langs.length?f.langs:['en']);const out=[];langs.forEach(lang=>{const m=langMeta(lang);const lead=`${m.greeting} ${esc(f.name)}! 🎂✨`;out.push(lead,relOpening(f,lang),...toneText(f,lang),baseClosing(lang));if(f.hobby){const hobbyMap={en:`I hope you still make plenty of time for ${esc(f.hobby)} along the way.`,hi:`और तुम्हें ${esc(f.hobby)} के लिए भी खूब समय मिले।`,hing:`Aur haan, ${esc(f.hobby)} ke liye bhi proper time milta rahe.`,bn:`আর ${esc(f.hobby)}-এর জন্যও যেন তোমার সময় থাকে।`,mr:`आणि ${esc(f.hobby)}साठीही तुला भरपूर वेळ मिळू दे.`,or:`ଏବଂ ${esc(f.hobby)} ପାଇଁ ମଧ୍ୟ ଭଲ ସମୟ ମିଳୁ।`,te:`ఇంకా ${esc(f.hobby)} కోసం కూడా నీకు మంచి సమయం దొరకాలి.`,ta:`${esc(f.hobby)}-க்காகவும் உனக்கு நல்ல நேரம் கிடைக்கட்டும்.`};out.push(hobbyMap[lang]||hobbyMap.en)}});return out.slice(0,Math.max(5,Math.min(10,out.length)))}

function renderRecipient(f){document.querySelector('.transition-overlay')?.remove();const L=langCopy(f),l=(f.langs&&f.langs[0])||'en';const emojis=(f.emojis||['✨','💗','🎂']).concat((f.customEmoji||'').split(/\s+/).filter(Boolean));const safeEmoji=emojis.length?emojis:['✨'];$('#app').innerHTML=`<div class="recipient">${controlsHTML(l)}<div class="floaters">${safeEmoji.slice(0,8).map((e,i)=>`<span class="floater" style="left:${8+i*11}%;animation-delay:${i*.8}s">${e}</span>`).join('')}</div><div id="stage" class="rec-stage"><div class="stage-card"><div class="eyebrow">${L.eyebrow}</div><h2 id="stageTitle">${L.intro}</h2><p id="stageText">${L.initial}</p><button class="btn primary" id="stageBtn">${L.continue}</button></div></div></div>`;bindControls();startMusic();startAmbientFloaters(safeEmoji.concat(['🌸','✨','💫','🦋']));installLeaveGuard();document.onkeydown=null;let gameIndex=0;const stage=()=>{$('#stageBtn').onclick=()=>{clickSound(520,.1);gameIndex=1;pageTransition('Let the little games begin…',playTapGame)}};let completedGameTransitions=0;function done(msg,next){const note=$('#gn');if(note)note.textContent=msg;celebrateSmall();const quick=completedGameTransitions>=2;const delay=quick?3000:6500;completedGameTransitions++;showGameTransition(msg,typeof next==='function'?'Next little moment':'One little moment',quick);finishTransition(next,delay)}
function playTapGame(){const g=L.games.tap;$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 1/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="game-progress" id="gp">0 / 5</div><div class="game-board" id="tapBoard"></div><div class="game-note" id="gn"></div></div>`;const board=$('#tapBoard');let score=0,timer=null,locked=false;const spawn=()=>{if(locked)return;board.querySelector('.tap-heart')?.remove();clearTimeout(timer);const h=document.createElement('button');h.className='tap-heart';h.textContent=['💗','💖','💕'][score%3];h.style.left=(14+Math.random()*72)+'%';h.style.top=(16+Math.random()*66)+'%';board.append(h);h.animate([{transform:'translate(-50%,-50%) scale(.72)',opacity:.25},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],{duration:360,easing:'ease-out'});timer=setTimeout(()=>{if(h.isConnected){h.remove();$('#gn').textContent=l==='hi'?'Heart चला गया — अगला आराम से पकड़ो 💗':l==='hing'?'Heart nikal gaya — next wala calmly catch karo 💗':'That one floated away — catch the next one 💗';setTimeout(spawn,650)}},2200);h.onclick=()=>{if(locked)return;locked=true;clearTimeout(timer);score++;clickSound(620+score*45,.09);sparkleAt(h);h.remove();$('#gp').textContent=`${score} / 5`;if(score>=5)done(g.success,playGardenGame);else{setTimeout(()=>{locked=false;spawn()},720)}}};spawn()}
function playGardenGame(){const g=L.games.garden;const target=(f.animal&&f.animal.trim())||'cat';const animalMap={cat:'🐱',dog:'🐶',rabbit:'🐰',panda:'🐼',bear:'🐻',fox:'🦊',lion:'🦁',tiger:'🐯',mouse:'🐭',hamster:'🐹',bird:'🐦',butterfly:'🦋'};const targetEmoji=animalMap[target.toLowerCase()]||'🐱';const pool=['🌸','🌷','🌼','🌿','🍀','🌱','🪻','🌻','🍃','🦋','🐞','🐝','🐸','🐢','🐿️','🐥','🍓','🍒','🍄','🌈','⭐','💗'];let items=Array.from({length:29},()=>pool[Math.floor(Math.random()*pool.length)]);const spot=Math.floor(Math.random()*items.length);items.splice(spot,0,targetEmoji);$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 2/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="garden-target">🔎 <strong>${l==='hi'?'ढूँढो:':l==='hing'?'Find:':'Find:'}</strong> ${targetEmoji}</div><div class="emoji-garden" id="garden"></div><div class="game-note" id="gn"></div></div>`;const grid=$('#garden');items.forEach(sym=>{const b=document.createElement('button');b.className='garden-emoji';b.textContent=sym;b.onclick=()=>{if(b.dataset.done)return;if(sym===targetEmoji){b.dataset.done='1';b.classList.add('found');clickSound(760,.12);sparkleAt(b);grid.querySelectorAll('button').forEach(x=>x.disabled=true);done(g.success,playMazeGame)}else{b.classList.add('wrong');clickSound(180,.07);setTimeout(()=>b.classList.remove('wrong'),260);$('#gn').textContent=L.wrong}};grid.append(b)})}
function playMazeGame(){const g=L.games.maze;const maps=[['#########','#P#     #','# # ### #','# # #   #','# ### # #','#   # # #','### # # #','#     #C#','#########'],['#########','#P      #','### ### #','#   #   #','# # # ###','# #     #','# ##### #','#      C#','#########'],['#########','#P#     #','# # ### #','# #   # #','# ### # #','#     # #','##### # #','#     #C#','#########']];const map=maps[Math.floor(Math.random()*maps.length)];let pos={r:1,c:1};const dirs={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 3/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="maze-wrap"><div class="maze-grid" id="maze"></div></div><div class="maze-controls"><button class="maze-btn" data-d="up">↑</button><div><button class="maze-btn" data-d="left">←</button><button class="maze-btn" data-d="down">↓</button><button class="maze-btn" data-d="right">→</button></div></div><div class="game-note" id="gn"></div></div>`;const grid=$('#maze');function draw(){grid.innerHTML='';map.forEach((row,r)=>[...row].forEach((cell,c)=>{const d=document.createElement('div');d.className='maze-cell '+(cell==='#'?'wall':'path');if(r===pos.r&&c===pos.c){d.classList.add('player');d.textContent='🐱'}else if(cell==='C'){d.classList.add('cake');d.textContent='🎂'}grid.append(d)}))}function move(dir){const [dr,dc]=dirs[dir],nr=pos.r+dr,nc=pos.c+dc;if(!map[nr]||map[nr][nc]==='#'){$('#gn').textContent=l==='hi'?'Wall! दूसरी side try करो।':'Wall there — try another way.';clickSound(170,.05);return}pos={r:nr,c:nc};clickSound(390,.045);draw();if(map[nr][nc]==='C'){clickSound(900,.14);done(g.success,playBalloonsGame)}}$$('.maze-btn').forEach(b=>b.onclick=()=>move(b.dataset.d));document.onkeydown=e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(k){e.preventDefault();move(k)}};draw()}

function playBalloonsGame(){const g=L.games.balloons;$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 4/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="game-progress" id="gp">0 / 7 balloons</div><div class="balloon-board" id="balloonBoard"></div><div class="game-note" id="gn"></div></div>`;const board=$('#balloonBoard');let score=0,finished=false;const items=[...Array(7).fill('🎈'),...Array(3).fill('🎊'),...Array(3).fill('💣')];items.sort(()=>Math.random()-.5);items.forEach((type,i)=>{const b=document.createElement('button');b.className=type==='💣'?'game-bomb':'game-balloon';b.textContent=type;b.dataset.type=type;b.style.left=(7+Math.random()*82)+'%';b.style.top=(6+Math.random()*82)+'%';b.style.animationDelay=(Math.random()*.8)+'s';b.onclick=()=>{if(finished||b.dataset.used)return;b.dataset.used='1';if(type==='💣'){finished=true;clickSound(120,.18);board.classList.add('bomb-flash');$('#gn').textContent=l==='hi'?'Oops! Bomb मिल गया — balloons फिर से try करो 💣':l==='hing'?'Oops! Bomb mil gaya — balloon game phir se start ho rahi hai. 💣':'Oops! That was the wrong one — the balloon game is restarting. 💣';setTimeout(()=>{board.classList.remove('bomb-flash');resetBalloons()},650);return}if(type!=='🎈'){clickSound(210,.06);b.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:240});$('#gn').textContent=l==='hi'?'Ye balloon nahi hai 😭':'That one does not count — find a real balloon 🎈';return}score++;clickSound(430+score*55,.08);sparkleAt(b);b.animate([{transform:'scale(1)'},{transform:'scale(1.35)',opacity:0}],{duration:280,easing:'ease-out'});setTimeout(()=>b.remove(),260);$('#gp').textContent=`${score} / 7 balloons`;if(score===7){finished=true;done(g.success,playMemoryGame)}};board.append(b)})}
function playMemoryGame(){const g=L.games.memory;const deck=['🎂','🎈','🎁','🌸','🎂','🎈','🎁','🌸'];deck.sort(()=>Math.random()-.5);$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 5/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="memory-grid" id="memoryGrid"></div><div class="game-note" id="gn"></div></div>`;const grid=$('#memoryGrid');let open=[],matched=0,locked=false;deck.forEach(sym=>{const b=document.createElement('button');b.className='memory-card';b.textContent='?';b.dataset.sym=sym;b.onclick=()=>{if(locked||b.classList.contains('matched')||b.classList.contains('flipped'))return;b.classList.add('flipped');b.innerHTML=`<span>${sym}</span>`;open.push(b);clickSound(500,.05);if(open.length===2){locked=true;if(open[0].dataset.sym===open[1].dataset.sym){open.forEach(x=>x.classList.add('matched'));matched++;open=[];locked=false;clickSound(760,.1);if(matched===4)done(g.success,playTimingGame)}else{setTimeout(()=>{open.forEach(x=>{x.classList.remove('flipped');x.textContent='?' });open=[];locked=false},650)}}};grid.append(b)})}
function playTimingGame(){const g=L.games.timing;$('#stage').innerHTML=`<div class="stage-card"><div class="tiny">${L.mini} · 6/7</div><h2>${g.title}</h2><p>${g.sub}</p><div class="timing-wrap"><div class="timing-track"><div class="timing-zone"></div><div class="timing-marker" id="tm">✦</div></div></div><button class="btn pink" id="timingBtn">✨ ${l==='hi'?'अब tap करो':l==='hing'?'Ab tap karo':'Tap now'}</button><div class="game-note" id="gn"></div></div>`;const marker=$('#tm'),btn=$('#timingBtn');let x=0,dir=1,last=performance.now(),running=true,raf=0;const loop=(now)=>{if(!running)return;const dt=Math.min(32,now-last);last=now;x+=dir*dt*.075;if(x>100){x=100;dir=-1}if(x<0){x=0;dir=1}marker.style.left=x+'%';raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);btn.onclick=()=>{if(!running)return;running=false;cancelAnimationFrame(raf);const good=x>=38&&x<=62;if(good){clickSound(820,.18);done(g.success,playCakeGame)}else{clickSound(190,.1);$('#gn').textContent=L.wrong;setTimeout(()=>{running=true;last=performance.now();raf=requestAnimationFrame(loop)},450)}}}

function celebrateSmall(){partyPoppers();if(!state.sound)return;clickSound(720,.07);setTimeout(()=>clickSound(880,.09),70)}function celebrationSound(){if(!state.sound||!audioReady())return;const notes=[523.25,523.25,587.33,523.25,698.46,659.25,523.25,523.25,587.33,523.25,783.99,698.46];notes.forEach((freq,i)=>setTimeout(()=>clickSound(freq,.18),i*105))}function sparkleAt(el){const r=el.getBoundingClientRect();for(let i=0;i<4;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','💗','🌸','⭐'][i];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',((Math.random()*100)-50)+'px');s.style.setProperty('--dy',((Math.random()*100)-50)+'px');document.body.append(s);setTimeout(()=>s.remove(),950)}}function burst(){const count=window.innerWidth<700?42:72;for(let i=0;i<count;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=`hsl(${Math.random()*360},75%,70%)`;c.style.transform=`rotate(${Math.random()*360}deg)`;document.body.append(c);setTimeout(()=>c.remove(),2800)}['🎈','🎈','🎉','🎊'].forEach((e,i)=>{const b=document.createElement('div');b.className='balloon';b.textContent=e;b.style.left=(12+i*24)+'%';b.style.setProperty('--x',(Math.random()*100-50)+'px');document.body.append(b);setTimeout(()=>b.remove(),5200)});for(let i=0;i<10;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','💗','🌸'][i%3];s.style.left=(10+Math.random()*80)+'%';s.style.top=(20+Math.random()*55)+'%';s.style.setProperty('--dx',((Math.random()*100)-50)+'px');s.style.setProperty('--dy',((Math.random()*120)-60)+'px');document.body.append(s);setTimeout(()=>s.remove(),950)}}
function reveal(f,safeEmoji){stopCelebrationFloaters();showGameTransition('Your little birthday moment is ready. 🌸','Just a tiny pause');const L=langCopy(f);finishTransition(()=>{burst();partyPoppers();celebrationSound();const celebrationTimerId=startCelebrationFloaters();celebrationTimer=celebrationTimerId;const l=(f.langs&&f.langs[0])||'en';const ps=wishText(f);const wish=ps.map(p=>`<p>${esc(p)}</p>`).join('');const wishes=l==='hi'?['तुम्हारी ज़िंदगी में हमेशा ऐसी वजहें रहें जिनके लिए दिल से शुक्रिया कहा जा सके। 🌷','जो लोग तुम्हें अपना-सा महसूस कराते हैं, वे हमेशा तुम्हारे पास रहें। 💗','तुम जो चाहो, उसकी तरफ धीरे-धीरे लेकिन पूरे दिल से बढ़ते रहो। ✨','इस साल तुम्हें बहुत सारी छोटी खुशियाँ मिलें — और उन्हें notice करने का समय भी मिले। 🌸','और सबसे ज़रूरी, खुद के लिए भी उतनी ही नरमी रखना जितनी तुम अपने लोगों के लिए रखते हो। 🤍']:l==='hing'?['Life mein hamesha aise moments milte rahein jinke liye dil se grateful feel ho. 🌷','Jo log aapko genuinely apna feel karvate hain, woh aapke close rahein. 💗','Jo cheezein aapko excite karti hain, unke peeche jaana aur apni pace par grow karna kabhi mat chhodiye. ✨','Is saal ki chhoti wins ko bhi celebrate kijiye — har good thing ko huge reason ki zaroorat nahi hoti. 🌸','Aur haan, khud ke saath bhi thoda soft rahiye. Aap bhi uske deserve karte hain. 🤍']:['May life keep giving you little reasons to feel grateful, even on the most ordinary days. 🌷','May the people who feel like home stay close, and may you always have someone to laugh with. 💗','May you keep moving toward the things that make you feel excited, proud and genuinely yourself. ✨','May this year bring you small wins worth celebrating, peaceful moments worth keeping, and memories that arrive when you least expect them. 🌸','And through all of it, I hope you remember to be as kind to yourself as you are to the people you love. 🤍'];const wishlets=wishes.map((w,i)=>`<div class="wishlet">${safeEmoji[i%safeEmoji.length]} ${w}</div>`).join('');const photoLabels=l==='hi'?['तुम्हारे लिए','एक प्यारी-सी याद']:l==='hing'?['Tumhare liye','Ek little memory']:['for you','a little memory'];const photos=(f.photos||[]).map((p,i)=>`<div class="photo"><img src="${p.src}" alt="${photoLabels[i%photoLabels.length]}"><small>${esc(p.label||photoLabels[i%photoLabels.length])} ✨</small></div>`).join('');const photoBlock=photos?`<section class="photo-grid">${photos}</section>`:'';const messageBlock=f.message?`<section class="card message-note" style="max-width:780px;margin:25px auto;text-align:left"><div class="tiny">${l==='hi'?'तुम्हारी तरफ़ से एक छोटी-सी बात…':l==='hing'?'Tumhari taraf se ek chhoti si baat…':'A little note, in your own words…'}</div><h2 style="font-family:'Playfair Display';margin:8px 0 10px">💌 ${l==='hi'?'दिल से':l==='hing'?'Dil se':'From the heart'}</h2><p style="white-space:pre-wrap;line-height:1.85;margin-bottom:0">${esc(f.message)}</p></section>`:'';const endUI={en:['Keep this little moment close. 🌸','When life gets busy and this day becomes a memory, I hope you still remember how much warmth was around you today — the smiles, the little surprises, and the people who were genuinely happy to celebrate you.','May the days ahead be kind to your heart, full of little reasons to smile, and filled with people who make you feel loved exactly as you are. ✨'],hi:['इस छोटे-से पल को अपने पास रखना। 🌸','जब कभी यह दिन बहुत दूर की याद बन जाए, तब भी आज की हँसी, अपने लोगों का प्यार और यह छोटी-सी खुशी तुम्हारे दिल में कहीं ज़रूर बची रहे।','आने वाला हर दिन तुम्हारे लिए थोड़ा और सुकून, थोड़ी और खुशी और ऐसे लोग लेकर आए जो तुम्हें ठीक वैसे ही अपनाएँ जैसे तुम हो। ✨'],hing:['Is little moment ko thoda sambhal kar rakhiye. 🌸','Kabhi life busy ho jaaye aur ye din bas ek memory ban jaaye, toh I hope aapko aaj ki smile, apne logon ki warmth aur ye chhoti si happiness yaad rahe.','Aage ka har din aapke liye thoda softer, thoda happier ho — aur aapke paas hamesha aise log rahein jinke saath aap bilkul apne reh saken. ✨'],bn:['এই ছোট্ট মুহূর্তটা যত্ন করে মনে রেখো। 🌸','কো ;const lastTitle=l==='hi'?'अभी एक आखिरी छोटी-सी चीज़ बाकी है। 👀':l==='hing'?'Abhi ek last little thing baaki hai. 👀':'There’s one last little thing waiting for you. 👀';const lastText=l==='hi'?'नीचे वाला button दबाओ — फिर ये आखिरी moment बस तुम्हारा है।':l==='hing'?'Neeche wala button dabaiye — phir ye last moment bas aapka hai.':'Press the button below, then keep this last little moment for yourself.';const lastBtn=l==='hi'?'आखिरी चीज़ खोलो':l==='hing'?'One last thing kholiye':'Open the last little thing';const finalUI={en:{homeTitle:'Now it’s your turn? 💌',homeText:'You can make a little birthday moment for someone you care about too — just because.',homeBtn:'Make a birthday surprise →'},hi:{homeTitle:'अब आपकी बारी? 💌',homeText:'अब आप भी किसी अपने के लिए एक छोटा-सा birthday surprise बना सकते हैं।',homeBtn:'अपना birthday surprise बनाइए →'},hing:{homeTitle:'Ab aapki baari? 💌',homeText:'Ab aap bhi kisi apne ke liye ek little birthday surprise bana sakte hain — just because.',homeBtn:'Apna surprise banaiye →'},bn:{homeTitle:'এবার তোমার পালা? 💌',homeText:'তুমিও তোমার প্রিয় কারও জন্য এমন একটা ছোট্ট birthday surprise বানাতে পারো।',homeBtn:'নিজের surprise বানাও →'},mr:{homeTitle:'आता तुझी पाळी? 💌',homeText:'तुलाही तुझ्या खास व्यक्तीसाठी असंच एक छोटंसं birthday surprise बनवता येईल.',homeBtn:'आपलं surprise बनव →'},or:{homeTitle:'ଏବେ ତୁମ ପାଳି? 💌',homeText:'ତୁମେ ମଧ୍ୟ ନିଜର କାହା ପାଇଁ ଏମିତି ଗୋଟେ ଛୋଟ birthday surprise ବନାଇପାରିବ।',homeBtn:'ନିଜ surprise ବନାଅ →'},te:{homeTitle:'ఇప్పుడు నీ turn? 💌',homeText:'నీకు special అయిన ఎవరికైనా ఇలాంటి చిన్న birthday surprise నువ్వూ తయారు చేయొచ్చు.',homeBtn:'నీ surprise తయారు చేయి →'},ta:{homeTitle:'இப்போ உன் turn? 💌',homeText:'உனக்கு பிடித்த ஒருவருக்காக நீயும் இப்படிப் ஒரு சின்ன birthday surprise உருவாக்கலாம்.',homeBtn:'உன் surprise உருவாக்கு →'}}[l]||finalUI.en;const homeTitle=finalUI.homeTitle,homeText=finalUI.homeText,homeBtn=finalUI.homeBtn;const app=document.createElement('div');app.className='recipient';app.innerHTML=`${controlsHTML(l)}<main class="container reveal"><div class="eyebrow">🎉 ${outLabel}</div><h1>${L.greeting}<br><span style="color:#252027;font-weight:700">${esc(f.name)}!</span> 🎂</h1><p class="sub">${today}</p><section class="wish card">${wish}</section>${photoBlock}<section class="card" style="max-width:780px;margin:25px auto;text-align:left"><h2 style="font-family:'Playfair Display';margin-top:0">🌷 ${more}</h2><div class="wishes">${wishlets}</div></section>${messageBlock}<section class="last"><div class="card one-last-card"><div class="tiny">${l==='hi'?'आखिरी छोटी-सी बात':l==='hing'?'ONE LAST LITTLE THING':'ONE LAST THING'}</div><h2 style="font-family:'Playfair Display'">${lastTitle}</h2><p class="sub">${lastText}</p><button class="btn primary" id="lastBtn">🎁 ${lastBtn}</button><div class="last-content" id="lastContent"><h2 style="font-family:'Playfair Display'">${endTitle}</h2><p class="sub">${endText}</p><p style="font-family:'Playfair Display';font-size:24px">${finalChapter}</p><div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--line)"><strong>Created by Shivaayu</strong><br><span class="tiny">made with love ♡</span><div style="margin-top:9px"><a href="https://instagram.com/Pvt_Shivaayu" target="_blank" rel="noopener">@Pvt_Shivaayu</a> · <a href="https://instagram.com/Selfish_Senpaiii" target="_blank" rel="noopener">@Selfish_Senpaiii</a></div></div></div></div></section><section class="home-cta"><div class="card"><div class="eyebrow">🌸 ${homeTitle}</div><p class="sub">${homeText}</p><button class="btn pink" id="homeCta">${homeBtn}</button></div></section></main>`;$('#app').replaceChildren(app);bindControls();startMusic();$('#lastBtn').onclick=()=>{if($('#lastBtn').dataset.busy)return;$('#lastBtn').dataset.busy='1';$('#lastBtn').disabled=true;showGameTransition(lastTitle,'One last little thing',true);finishTransition(()=>{$('#lastContent').classList.add('show');$('#lastBtn').style.display='none';burst();partyPoppers();celebrationSound();startCelebrationFloaters();setTimeout(()=>$('#lastContent').scrollIntoView({behavior:'smooth',block:'center'}),220)},3000)};$('#homeCta').onclick=()=>{pageTransition(homeBtn||'Back to Sweetie’s Wish',()=>{history.pushState({},'',location.pathname);renderHome();window.scrollTo(0,0)},2600,true)}} ,4450)}
